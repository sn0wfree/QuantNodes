[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantnodes"
version = "2.8.0"
description = "AI-native quantitative research framework with symbolic computation and SQL pushdown"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "sn0wfree", email = "snowfreedom0815@gmail.com"}]
license = {text = "MIT"}
keywords = ["Node", "Databases", "Quantitative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/sn0wfree/QuantNodes"

[project.optional-dependencies]
streamlit-ui = ["streamlit>=1.28.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.5",
]

[project.scripts]
quantnodes = "QuantNodes.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["QuantNodes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E731",  # lambda assignment: common in operator registries, project style
]

[tool.ruff.lint.per-file-ignores]
# Symbolic dialect implements an abstract SQL dialect interface; one-liner
# method bodies are intentional for line-by-line parity with the other dialects.
"QuantNodes/symbolic/dialect.py" = ["E701", "E501"]
# Factor / operator / time-series code: dense math/algorithm code frequently
# needs longer lines for readability of expressions.
"QuantNodes/factor_node/factor_table.py" = ["E501"]
"QuantNodes/factor_node/factor_operation.py" = ["E501"]
"QuantNodes/factor_node/factor.py" = ["E501"]
"QuantNodes/factor_node/factor_functions/talib_ops.py" = ["E501"]
"QuantNodes/factor_node/factor_functions/time_ops.py" = ["E501"]
"QuantNodes/operators/talib.py" = ["E501"]
"QuantNodes/operators/time_series.py" = ["E501"]
"QuantNodes/database_node/clickhouse_node.py" = ["E501"]
# CLI is a 1300-line module scheduled for E1 split; allow long lines for now.
"QuantNodes/cli/__init__.py" = ["E501"]
"QuantNodes/core/control.py" = ["E741"]  # TypeVar('I') / TypeVar('O') are conventional
"tests/**/*.py" = ["E402", "E501", "E741"]  # tests allow flexible style

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
