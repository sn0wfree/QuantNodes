[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantnodes"
version = "3.0.2"
description = "AI-native quantitative research framework with symbolic computation and SQL pushdown"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "sn0wfree", email = "snowfreedom0815@gmail.com"}]
license = {text = "MIT"}
keywords = ["Node", "Databases", "Quantitative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # API/Web
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    # 数据处理
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "polars>=1.0.0",
    # 数据库
    "SQLAlchemy>=2.0.0",
    "clickhouse-connect>=0.6.0",
    "PyMySQL>=1.0.0",
    "duckdb>=0.9.0",
    # 配置与类型
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    # 统计分析
    "statsmodels>=0.14.0",
    "sympy>=1.12.0",
    # AI/LLM
    "openai>=1.3.0",
    # 可视化
    "plotly>=5.17.0",
    # 工具库
    "requests>=2.33.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "PyYAML>=6.0",
    "progressbar2>=4.0.0",
    "tables>=3.8.0",
    "APScheduler>=3.10.0",
    "llmwikify>=0.30.0",
    "bs4>=0.0.1",
    "msgpack>=1.0.0",
    "scipy>=1.10.0",
    # llmwikify 0.30+ 在 import 时强依赖 fastmcp（即使不用 MCP 也会触发）
    "fastmcp>=2.0",
    # pandas to_parquet 需要
    "pyarrow>=14.0.0",
]

# 完整开发环境额外依赖（pip install -r requirements.txt）
# requirements.txt 仍然保留为开发环境参考。

[project.urls]
Homepage = "https://github.com/sn0wfree/QuantNodes"
Documentation = "https://github.com/sn0wfree/QuantNodes/tree/master/docs"
Repository = "https://github.com/sn0wfree/QuantNodes.git"
Issues = "https://github.com/sn0wfree/QuantNodes/issues"
Changelog = "https://github.com/sn0wfree/QuantNodes/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# 启用 nanobot agent / WebUI / MCP / 飞书 等完整功能
agent = [
    "nanobot-ai>=0.2.1,<0.3.0",
]
# 暴露 quant 工具库为 MCP server（无需 nanobot 也能跑，但与 agent 组合时
# 可让 nanobot 子智能体通过 stdio 调用 quant 工具）
mcp = ["fastmcp>=3.0", "mcp[cli]>=1.0"]
# 一键装齐 agent + mcp
all = ["quantnodes[agent,mcp]"]
streamlit-ui = ["streamlit>=1.28.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-timeout>=2.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.5",
]

[project.scripts]
quantnodes = "QuantNodes.cli:main"

[project.entry-points."quantnodes.tools"]
echo = "QuantNodes.agent.tools.echo:EchoTool"
sandbox = "QuantNodes.agent.tools.sandbox:SandboxTool"
pipeline = "QuantNodes.agent.tools.pipeline:PipelineTool"
strategy = "QuantNodes.agent.tools.strategy:StrategyTool"
backtest = "QuantNodes.agent.tools.backtest:BacktestTool"
factor = "QuantNodes.agent.tools.factor:FactorTool"
config_backtest = "QuantNodes.agent.tools.config_backtest:ConfigBacktestTool"
wiki = "QuantNodes.agent.tools.wiki:WikiTool"
file_ops = "QuantNodes.agent.tools.file_ops:FileOpsTool"
code_search = "QuantNodes.agent.tools.code_search:CodeSearchTool"
git_ops = "QuantNodes.agent.tools.git_ops:GitOpsTool"
web_fetch = "QuantNodes.agent.tools.web_fetch:WebFetchTool"
web_search = "QuantNodes.agent.tools.web_search:WebSearchTool"
task = "QuantNodes.agent.tools.task:TaskTool"
alpha_evaluate = "QuantNodes.agent.tools.alpha_evaluate:AlphaEvaluateTool"
alpha_backtest = "QuantNodes.agent.tools.alpha_backtest:AlphaBacktestTool"
operator_lookup = "QuantNodes.agent.tools.operator_lookup:OperatorLookupTool"

[project.entry-points."quantnodes.operators"]
builtin = "QuantNodes.research.quant_alpha.operator_vocab:list_vocab_operators"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["QuantNodes*"]

[tool.setuptools.package-data]
"QuantNodes.agent.skills_quant" = ["**/SKILL.md"]
"QuantNodes.agent.config" = ["templates/*.yaml"]
"QuantNodes.research" = ["**/*.md", "**/CHANGELOG.md"]
"QuantNodes.research.quant_alpha" = ["**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["QuantNodes/research/quant_alpha"]
omit = [
    "*/__pycache__/*",
    "*/archive/*",
    "*/_legacy_3c/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = false
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E731",  # lambda assignment: common in operator registries, project style
]

[tool.ruff.lint.per-file-ignores]
# Symbolic dialect implements an abstract SQL dialect interface; one-liner
# method bodies are intentional for line-by-line parity with the other dialects.
"QuantNodes/symbolic/dialect.py" = ["E701", "E501"]
# Factor / operator / time-series code: dense math/algorithm code frequently
# needs longer lines for readability of expressions.
"QuantNodes/factor_node/factor_table.py" = ["E501"]
"QuantNodes/factor_node/factor_operation.py" = ["E501"]
"QuantNodes/factor_node/factor.py" = ["E501"]
"QuantNodes/factor_node/factor_functions/talib_ops.py" = ["E501"]
"QuantNodes/factor_node/factor_functions/time_ops.py" = ["E501"]
"QuantNodes/operators/talib.py" = ["E501"]
"QuantNodes/operators/time_series.py" = ["E501"]
"QuantNodes/database_node/clickhouse_node.py" = ["E501"]
# CLI is a 1300-line module scheduled for E1 split; allow long lines for now.
"QuantNodes/cli/__init__.py" = ["E501"]
"QuantNodes/core/control.py" = ["E741"]  # TypeVar('I') / TypeVar('O') are conventional
"tests/**/*.py" = ["E402", "E501", "E741"]  # tests allow flexible style

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
