[tool.poetry]
name = "quantnodes"
version = "0.1.0"
description = "AI-native quantitative research framework with symbolic computation and SQL pushdown"
authors = ["snowfreedom0815@gmail.com"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.13"

# 数据处理核心
pandas = "^2.1.0"
numpy = "^1.24.0"

# 配置与类型系统
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"

# 数据库层
SQLAlchemy = "^2.0.0"
clickhouse-connect = "^0.6.0"
PyMySQL = "^1.0.0"
duckdb = "^0.9.0"

# 符号计算
sympy = "^1.12.0"

# 统计分析
statsmodels = "^0.14.0"

# Web UI
streamlit = "^1.28.0"
plotly = "^5.17.0"

# API 服务
fastapi = ">=0.110.0"
uvicorn = { extras = ["standard"], version = ">=0.29.0" }
websockets = ">=12.0"
python-dotenv = ">=1.0.0"

# 工具库
requests = "^2.31.0"
tqdm = "^4.66.0"
setuptools = ">=40.8.0"
requests_html = ">=0.10.0"

# Polars
polars = ">=1.0.0"

# 技术分析 (可选)
TA-Lib = {version = ">=0.6.0", optional = true}

[tool.poetry.extras]
talib = ["TA-Lib"]

[tool.poetry.group.dev.dependencies]
# 代码质量
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.7.0"

# 测试
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"

# 文档
mkdocs = "^1.5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers --ignore=QuantNodes"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ['py39']
