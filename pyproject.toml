[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantnodes"
version = "0.4.1"
description = "AI-native quantitative research framework with symbolic computation and SQL pushdown"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "sn0wfree", email = "snowfreedom0815@gmail.com"}]
license = {text = "MIT"}

[project.scripts]
quantnodes = "QuantNodes.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["QuantNodes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]