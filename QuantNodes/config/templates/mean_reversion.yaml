# mean_reversion.yaml
# 均值回复策略配置

version: "1.0"
name: "mean_reversion"
description: "均值回复策略"

# 因子定义
factors:
  - name: close_ma_diff
    expr: "(close - close.rolling(20).mean()) / close.rolling(20).std()"
    description: "价格偏离度"

# 运算
operations:
  - type: section
    name: zscore_rank
    category: rank
    inputs: [close_ma_diff]

# 组合
composite:
  - name: alpha
    formula: "-rank(close_ma_diff)"  # 负rank表示均值回复

backtest:
  start_date: "2023-01-01"
  end_date: "2024-12-31"
  initial_cash: 1000000

validation:
  run_tests: true
  metrics:
    ic_threshold: 0.02