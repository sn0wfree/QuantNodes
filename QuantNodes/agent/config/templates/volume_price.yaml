# volume_price.yaml
# 量价背离策略
# 逻辑: 价格上涨但成交量下降时卖出，价格下跌但成交量上升时买入

version: "1.0"
name: "volume_price_divergence"
description: "量价背离策略 - 价格上涨但成交量下降时卖出，价格下跌但成交量上升时买入"

data:
  source: clickhouse
  conn_ini: conn.ini
  conn_section: ClickHouse
  table: quote.cn_stock
  columns: [ts_code, trade_date, open, high, low, close, vol]

  db_date_column: trade_date
  db_code_column: ts_code
  date_column: date
  code_column: code

  column_mapping:
    ts_code: code
    trade_date: date
    vol: volume

  query_filter: "WHERE trade_date >= toDateTime('2023-07-01')"

factors:
  - name: price_change
    expr: "close / ts_lag(close, 5) - 1"
    description: "5日价格变化率"

  - name: volume_ma
    expr: "ts_mean(volume, 20)"
    description: "20日均量"

  - name: volume_ratio
    expr: "volume / volume_ma"
    description: "成交量相对均量比"

  - name: turnover
    expr: "volume / ts_mean(volume, 60)"
    description: "换手率（相对60日均量）"

operations:
  - type: section
    name: price_rank
    category: rank
    inputs: [price_change]
    description: "价格变化截面排名"

  - type: section
    name: volume_rank
    category: rank
    inputs: [volume_ratio]
    description: "成交量变化截面排名"

  - type: section
    name: turnover_rank
    category: rank
    inputs: [turnover]
    description: "换手率截面排名"

composite:
  - name: alpha
    formula: "0.5 * price_rank + 0.3 * (-1 * volume_rank) + 0.2 * turnover_rank"

backtest:
  start_date: "2023-07-01"
  end_date: "2024-07-19"
  initial_cash: 1000000
  commission: 0.001
  slippage: 0.001

  signals:
    buy_threshold: 0.6
    sell_threshold: 0.4

  positions:
    max_positions: 10
    rebalance_freq: "weekly"

output:
  format: parquet
  path: "outputs/volume_price_result.parquet"
  save_signals: true
